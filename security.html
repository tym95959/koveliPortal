<!DOCTYPE html>
<html lang="en">
<head>
<title>Change PIN | Koveli staff portal</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E2A33">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=3">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/core.js?v=3"></script>
</head>
<body>
<main class="page" style="max-width:760px">
  <div class="page-head"><div><h1>Change PIN</h1><p>You need your current PIN to save a change.</p></div></div>
  <section class="panel">
    <div class="panel-body form">
      <label class="field"><span>Current PIN</span><input type="password" id="current" inputmode="numeric" maxlength="8" autocomplete="current-password"></label>
      <div class="form-2">
        <label class="field"><span>New PIN</span><input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="4 to 8 digits" autocomplete="new-password"></label>
        <label class="field"><span>New PIN again</span><input type="password" id="pin2" inputmode="numeric" maxlength="8" autocomplete="new-password"></label>
      </div>
      <button class="btn primary" id="save" type="button">Save new PIN</button>
    </div>
  </section>
</main>
<script>
(async function () {
  "use strict";
  const { id } = K;
  const me = await K.start();
  if (!me) return;

  id("save").onclick = () => K.busy(id("save"), async () => {
    const currentCode = id("current").value.trim(), newPin = id("pin").value.trim();
    if (!currentCode) return K.toast("Type your current PIN.", "bad");
    if (!/^\d{4,8}$/.test(newPin)) return K.toast("The new PIN must be 4 to 8 digits.", "bad");
    if (newPin !== id("pin2").value.trim()) return K.toast("The two new PINs are not the same.", "bad");
    await K.api("/api/set-code", { currentCode, newPin });
    id("current").value = id("pin").value = id("pin2").value = "";
    K.toast("PIN changed.", "ok");
  });
})();
</script>
</body>
</html>
